name: Build for pushes and PRs

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
      - '.github/dependabot.yml'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
      - '.github/dependabot.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  NUGET_PACKAGES: ${{ github.workspace }}\.nuget\packages

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-main-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-main-
            nuget-${{ runner.os }}-

      - name: Restore dependencies
        run: dotnet restore BBPC.sln

      - name: Build
        run: dotnet build BBPC.sln -c Debug --no-restore

      - name: Upload BBPC.dll
        uses: actions/upload-artifact@v7
        with:
          name: BBPC.dll
          path: ./BBPC/Build/Debug/BBPC.dll
          if-no-files-found: error
          retention-days: 7

      - name: Upload dependencies
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: Dependencies.zip
          path: |
            ./Dlls/MonoMod.Backports.dll
            ./Dlls/MonoMod.ILHelpers.dll
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  build-extensions:
    runs-on: windows-latest
    needs: build
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - branch: feat/challengejar
            name: BBPC.ChallengeJarExtension.dll
            file: BBPC.ChallengeJarExtension.dll
          - branch: feat/template
            name: BBPC.ExtensionTemplate.dll
            file: BBPC.ExtensionTemplate.dll
          - branch: feat/ModManager
            name: BBPC.ModManagerExtension.dll
            file: BBPC.ModManagerExtension.dll
          - branch: feat/pluslevelstudio
            name: BBPC.PlusLevelStudioExtension.dll
            file: BBPC.EditorExtension.dll
          - branch: feat/nullstyle
            name: BBPC.NULLStyleExtension.dll
            file: BBPC.NULLStyleExtension.dll
          - branch: feat/texturepack
            name: BBPC.TextureExtension.dll
            file: BBPC.TextureExtension.dll
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.branch }}

      - name: Download BBPC.dll from this workflow
        uses: actions/download-artifact@v7
        with:
          name: BBPC.dll
          path: ./Dlls

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ matrix.branch }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ matrix.branch }}-
            nuget-${{ runner.os }}-main-
            nuget-${{ runner.os }}-

      - name: Restore dependencies
        run: dotnet restore BBPC.sln

      - name: Build
        run: dotnet build BBPC.sln -c Debug --no-restore

      - name: Upload extension
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: ./BBPC/Build/Debug/${{ matrix.file }}
          if-no-files-found: error
          retention-days: 7
