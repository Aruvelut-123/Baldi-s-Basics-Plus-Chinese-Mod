name: Build for pushes and PRs

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
      - '.github/dependabot.yml'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
      - '.github/dependabot.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  NUGET_PACKAGES: ${{ github.workspace }}\.nuget\packages

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-main-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-main-
            nuget-${{ runner.os }}-

      - name: Restore dependencies
        run: dotnet restore BBPC.sln

      - name: Build
        run: dotnet build BBPC.sln -c Debug --no-restore

      - name: Upload BBPC artifacts
        uses: actions/upload-artifact@v7
        with:
          name: BBPC-artifacts
          path: |
            ./BBPC/Build/Debug/BBPC.dll
            ./BBPC/Build/Debug/BBPCUpdatePatcher.dll
          if-no-files-found: error
          retention-days: 7