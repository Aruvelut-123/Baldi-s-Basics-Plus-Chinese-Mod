name: Build for release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  NUGET_PACKAGES: ${{ github.workspace }}\.nuget\packages

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-release-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-main-
            nuget-${{ runner.os }}-

      - name: Restore dependencies
        run: dotnet restore BBPC.sln

      - name: Build
        run: dotnet build BBPC.sln -c Release --no-restore

      - name: Upload BBPC artifacts for dependent jobs
        uses: actions/upload-artifact@v7
        with:
          name: BBPC-release-artifacts
          path: |
            ./BBPC/Build/Release/BBPC.dll
            ./BBPC/Build/Release/BBPCUpdatePatcher.dll
          if-no-files-found: error
          retention-days: 1

  changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout all history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install git-cliff
        uses: taiki-e/install-action@git-cliff

      - name: Generate changelog
        run: git-cliff --latest > CHANGELOG.md

      - name: Upload changelog
        uses: actions/upload-artifact@v7
        with:
          name: release-changelog
          path: CHANGELOG.md
          if-no-files-found: error
          retention-days: 1

  publish:
    runs-on: ubuntu-latest
    needs: [build, changelog]
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download BBPC artifacts
        uses: actions/download-artifact@v7
        with:
          name: BBPC-release-artifacts
          path: ./release-assets

      - name: Download changelog
        uses: actions/download-artifact@v7
        with:
          name: release-changelog
          path: ./release-assets/changelog

      - name: Publish release asset and changelog
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          body_path: ./release-assets/changelog/CHANGELOG.md
          fail_on_unmatched_files: true
          files: |
            ./release-assets/*.dll